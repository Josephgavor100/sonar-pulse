name: sonar-pulse

services:
  qdrant:
    image: qdrant/qdrant:latest          # pin a version (e.g. v1.x.y) once you settle on one
    container_name: sonar-pulse-qdrant
    ports:
      - "6333:6333"                      # REST API + dashboard: http://localhost:6333/dashboard
      - "6334:6334"                      # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage   # persists vectors across restarts
    restart: unless-stopped
    healthcheck:                         # the image has no curl; use a bash TCP probe
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build: ./backend
    container_name: sonar-pulse-backend
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: sonar_pulse_audio
      HF_HOME: /root/.cache/huggingface
      WATCHFILES_FORCE_POLLING: "true"   # reliable live reload on Windows/macOS bind mounts
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app           # live code reload
      - ./backend/scripts:/app/scripts
      - ./data:/data                     # music/ and queries/ for the CLI
      - hf_cache:/root/.cache/huggingface  # keeps the AST weights between rebuilds
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/app
    restart: on-failure

volumes:
  qdrant_storage:
  hf_cache: